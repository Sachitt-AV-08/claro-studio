appId: com.claro.workbench
productName: CLARO Workbench
electronVersion: 29.4.6
copyright: "Copyright © 2026 GLARO Workbench"
files:
  - "dist/**"
  - "dist-electron/**"
  - "vendor/**"
  - "skills/**"
  - "package.json"
asar: false
directories:
  output: release
  buildResources: assets
win:
  target:
    - target: dir
      arch:
        - x64
  icon: assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true