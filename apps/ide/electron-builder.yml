appId: com.claro.workbench
productName: CLARO Workbench
electronVersion: 29.4.6
copyright: "Copyright © 2026 CLARO Workbench"
files:
  - "dist/**"
  - "dist-electron/**"
  - "vendor/**"
  - "skills/**"
  - "package.json"
asar: true
directories:
  output: release/${version}
  buildResources: assets
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: dir
      arch:
        - x64
  icon: assets/icon.png
  artifactName: "${productName}-${version}-${arch}.exe"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CLARO Workbench
  runAfterFinish: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: "${productName}-${version}-Portable-${arch}.exe"